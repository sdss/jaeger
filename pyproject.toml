[project]
name = "jaeger"
version = "1.11.2a1"
description = "Controllers for the SDSS-V FPS"
authors = [ { name = "José Sánchez-Gallego", email = "gallegoj@uw.edu" } ]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.18.1",
    "sdss-drift>=1.2.0",
    "pymodbus>=3.7",
    "sdss-clu>=2.6.0",
    "sdsstools>=1.9.6",
    "sdssdb>=0.13.5,<1.0.0",
    "sdss-kaiju",
    "sdss-coordio>=1.19.0b2",
    "click_default_group>=1.2.2",
    "zc.lockfile>=2.0",
    "polars>=2.0.0",
    "adbc-driver-postgresql>=0.9.0",
    "anyio>=4.15.1",
]

[project.urls]
Homepage = "https://github.com/sdss/jaeger"
Repository = "https://github.com/sdss/jaeger"
Documentation = "https://sdss-jaeger.readthedocs.io/en/latest/"

[project.scripts]
jaeger = "jaeger.__main__:jaeger"
robotcalib = "jaeger.scripts.robotcalib:robotcalib"

[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "invoke>=1.3.0",
    "flake8>=3.7.9",
    "doc8>=0.8.0",
    "pytest>=5.2.2",
    "progressbar2>=3.39.3",
    "pytest-asyncio>=0.10.0",
    "pytest-cov>=2.8.1",
    "pytest-sugar>=0.9.2",
    "isort>=5.0.0",
    "coverage[toml]>=5.0",
    "Sphinx>=7.0",
    "sphinx-click>=2.3.0",
    "ipdb>=0.13.3",
    "autopep8>=1.5.4",
    "rstcheck>=3.3.1",
    "pytest-mock>=3.5.1",
    "pyserial-asyncio>=0.5",
    "sphinx-jsonschema>=1.16.8",
    "myst-parser>=0.14.0",
    "furo>=2021.6.18-beta.36",
    "nox>=2021.6.12",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-copybutton>=0.3.3",
    "matplotlib>=3.4.3",
    "ruff>=0.1.0",
    "ty>=0.0.32",
]

[tool.uv]
package = true

[tool.uv.sources]
# sdss-clu = { git = "https://github.com/sdss/clu", branch = "main" }
sdss-kaiju = { git = "https://github.com/sdss/kaiju", branch = "albireox/1.4.0" }

[tool.ruff]
line-length = 88
target-version = 'py312'
exclude = ["typings/"]

[tool.ruff.lint]
ignore = ["UP009", "EXE001", "BLE001", "SIM102", "PLC0105"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["jaeger"]
lines-after-imports = 2
section-order = ["future", "standard-library", "typing", "third-party", "sdss", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
typing = ["typing"]
sdss = ["sdsstools", "clu", "sdssdb", "drift", "coordio", "kaiju", "fps_calibrations"]

[tool.ty.environment]
extra-paths = ["./typings"]

[tool.ty.analysis]
return-type-inference = "always"

[tool.pytest.ini_options]
addopts = "-p no:logging --disable-warnings --cov jaeger --cov-report xml --cov-report html --cov-report term"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*The loop argument is deprecated since.*",
    "ignore:.*Loading an empty FPS.*",
    "ignore:.*They have been added to the.*",
]
markers = [
    "rtd2: Temperature of the RTD2 sensor"
]

[tool.coverage.run]
branch = true
include = ["src/jaeger/*"]
omit = [
    "*/__main__.py",
    "*/__init__.py",
    "*/testing.py",
    "*/cannet.py",
    "*/interfaces/message.py",
    "*/actor/commands/bootloader.py",
    "*/actor/commands/talk.py",
    "*/commands/calibration.py",
    "*/exceptions.py",
    "*/scripts/*",
    "*/plotting.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "class AsyncioExecutor",
    "class CANnetInterface",
    "if TYPE_CHECKING:",
    "def __repr__"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/jaeger"]
